name: Bug report
description: Report incorrect SDK behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API tokens or workspace data.
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Browser
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the method called, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: typescript
    validations:
      required: true
