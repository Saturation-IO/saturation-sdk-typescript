name: Feature request
description: Propose an SDK improvement
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe what the integration needs to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed SDK shape
      description: Show the method or type you would expect to use.
      render: typescript
